<style id="gc-pro-upgrade">
/* ---------- Google design tokens for calendar ---------- */
#screen-calendar{
  --gc-blue:#1a73e8; --gc-blue-d:#1557b0;
  --gc-red:#ea4335;
  --gc-chip-bg:color-mix(in srgb,var(--event-color,#1a73e8) 9%,var(--cal-surface,#fff));
  --gc-ink:var(--cal-ink,var(--text-light));
  --gc-muted:var(--cal-muted,var(--text-gray));
  --gc-half:color-mix(in srgb,var(--cal-grid-line,rgba(60,64,67,.15)) 45%,transparent);
}
html[data-theme="dark"] #screen-calendar{ --gc-blue:#8ab4f8; --gc-blue-d:#aecbfa; }

/* ═══ 1) TOOLBAR — Google header style ═══ */
#screen-calendar .cal-toolbar{
  padding:10px 16px; gap:10px;
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb,var(--cal-surface,#fff) 88%,transparent);
  backdrop-filter:blur(14px) saturate(1.1);
}
#screen-calendar .cal-title{font-family:Google Sans,system-ui,sans-serif;font-size:22px;font-weight:400;letter-spacing:0;min-width:0}
#screen-calendar .cal-range-btn{
  border:1px solid color-mix(in srgb,var(--gc-muted) 35%,transparent);
  color:var(--gc-ink); font-weight:600; font-size:13px; padding:8px 16px; border-radius:999px;
  transition:background .15s ease, box-shadow .15s ease;
}
#screen-calendar .cal-range-btn:hover{background:color-mix(in srgb,var(--gc-muted) 10%,transparent); box-shadow:0 1px 2px rgba(60,64,67,.2)}
#screen-calendar .cal-icon-btn{
  width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--gc-ink);
  font-size:18px;transition:background .15s ease;display:inline-flex;align-items:center;justify-content:center;
}
#screen-calendar .cal-icon-btn:hover{background:color-mix(in srgb,var(--gc-muted) 12%,transparent)}
#screen-calendar .cal-btn{
  border-radius:999px;font-weight:600;font-size:13px;padding:9px 16px;
  border:1px solid color-mix(in srgb,var(--gc-muted) 30%,transparent);
  transition:background .15s ease,box-shadow .15s ease,transform .1s ease;
}
#screen-calendar .cal-btn:active{transform:scale(.97)}
#screen-calendar .cal-btn.primary{
  background:var(--gc-blue);color:#fff;border-color:transparent;
  box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  letter-spacing:.2px;
}
html[data-theme="dark"] #screen-calendar .cal-btn.primary{color:#202124}
#screen-calendar .cal-btn.primary:hover{background:var(--gc-blue-d);box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
#screen-calendar .cal-search{
  border-radius:999px;padding:9px 16px;font-size:13px;
  background:color-mix(in srgb,var(--gc-muted) 7%,transparent);
  border:1px solid transparent;transition:box-shadow .15s ease,background .15s ease,width .2s ease;
}
#screen-calendar .cal-search:focus{background:var(--cal-surface,#fff);border-color:var(--gc-blue);box-shadow:0 1px 3px rgba(60,64,67,.2)}
#screen-calendar .cal-views{background:color-mix(in srgb,var(--gc-muted) 8%,transparent);border:0;border-radius:999px;padding:3px;gap:2px}
#screen-calendar .cal-view{border-radius:999px;font-weight:600;font-size:12.5px;padding:7px 13px;color:var(--gc-muted);transition:background .15s ease,color .15s ease}
#screen-calendar .cal-view:hover{background:color-mix(in srgb,var(--gc-muted) 10%,transparent);color:var(--gc-ink)}
#screen-calendar .cal-view.active{background:var(--gc-blue);color:#fff;box-shadow:0 1px 2px rgba(60,64,67,.3)}
html[data-theme="dark"] #screen-calendar .cal-view.active{color:#202124}

/* ═══ 2) TIME GRID — Google week/day look ═══ */
#screen-calendar .cal-days-grid{
  background-image:
    linear-gradient(to bottom,transparent 27px,var(--gc-half) 28px,transparent 28px),
    linear-gradient(to bottom,transparent 55px,var(--cal-grid-line,rgba(60,64,67,.15)) 56px) !important;
  background-size:100% 56px !important;
}
#screen-calendar .cal-day-head{background:color-mix(in srgb,var(--cal-surface,#fff) 92%,transparent);backdrop-filter:blur(6px)}
#screen-calendar .cal-day-head .dow{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
#screen-calendar .cal-day-head .dom{font-size:22px;font-weight:400;width:40px;height:40px;transition:background .15s ease,color .15s ease}
#screen-calendar .cal-day-head.today .dom{background:var(--gc-blue);color:#fff;font-weight:500}
html[data-theme="dark"] #screen-calendar .cal-day-head.today .dom{color:#202124}
#screen-calendar .cal-day-head.today .dow{color:var(--gc-blue);font-weight:700}
/* weekend dimming */
#screen-calendar .cal-day-col.gc-wknd{background:color-mix(in srgb,var(--gc-muted) 4%,transparent)}
#screen-calendar .cal-month-cell.gc-wknd{background:color-mix(in srgb,var(--gc-muted) 5%,var(--cal-cell,transparent))}

/* NOW line (Google red line) */
.gc-now{position:absolute;left:0;right:0;height:2px;background:var(--gc-red);z-index:6;pointer-events:none;border-radius:2px}
.gc-now::before{content:'';position:absolute;inset-inline-start:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--gc-red);box-shadow:0 0 0 2px color-mix(in srgb,var(--gc-red) 25%,transparent)}

/* ═══ 3) EVENT CHIPS — Google style ═══ */
#screen-calendar .cal-event{
  left:4px;right:4px;border-radius:8px;padding:4px 8px 4px 10px;
  background:var(--gc-chip-bg);
  border:1px solid color-mix(in srgb,var(--event-color,#1a73e8) 22%,transparent);
  border-inline-start-width:4px;
  box-shadow:0 1px 2px rgba(60,64,67,.12);
  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:1px;
  container-type:size;
  transition:box-shadow .15s ease,filter .15s ease,transform .15s ease;
}
#screen-calendar .cal-event:hover{box-shadow:0 2px 6px 2px rgba(60,64,67,.2);filter:brightness(1.03);z-index:8}
#screen-calendar .cal-event:active{cursor:grabbing}
#screen-calendar .cal-event.done{opacity:.55}
#screen-calendar .cal-event.done .gc-ev-title{text-decoration:line-through}
#screen-calendar .cal-event .gc-ev-time{font-size:10.5px;font-weight:600;color:var(--gc-muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#screen-calendar .cal-event .gc-ev-title{font-size:12.5px;font-weight:600;color:var(--gc-ink);line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* short events → single Google line: "9:00 Title" */
@container (max-height:48px){
  #screen-calendar .cal-event{flex-direction:row;align-items:center;gap:6px;padding-top:3px;padding-bottom:3px}
  #screen-calendar .cal-event .gc-ev-title{-webkit-line-clamp:1;flex:1;min-width:0;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
  #screen-calendar .cal-event .gc-ev-time{flex-shrink:0}
}
#screen-calendar .cal-event .cal-resize-grip{opacity:0;transition:opacity .15s ease}
#screen-calendar .cal-event:hover .cal-resize-grip{opacity:.5}
/* drop affordance while dragging from rail */
#screen-calendar.gc-droppable .cal-day-col{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--gc-blue) 3%,transparent)}
#screen-calendar .cal-day-col.cal-drop-target{box-shadow:inset 0 0 0 2px var(--gc-blue);background:color-mix(in srgb,var(--gc-blue) 7%,transparent)!important;outline:0}

/* ═══ 4) MONTH view chips ═══ */
#screen-calendar .cal-month-cell{transition:background .15s ease;cursor:default}
#screen-calendar .cal-month-cell:hover{background:color-mix(in srgb,var(--gc-muted) 6%,var(--cal-cell,transparent))}
#screen-calendar .cal-month-cell .cal-month-num{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:500;transition:background .15s}
#screen-calendar .cal-month-cell.today .cal-month-num{background:var(--gc-blue);color:#fff;font-weight:600}
html[data-theme="dark"] #screen-calendar .cal-month-cell.today .cal-month-num{color:#202124}
#screen-calendar .cal-month-event{
  border:0;border-radius:6px;padding:2px 8px;height:22px;line-height:18px;font-size:11.5px;font-weight:500;
  background:var(--gc-chip-bg);color:var(--gc-ink);
  display:flex;align-items:center;gap:6px;text-align:start;
  transition:box-shadow .15s ease,filter .15s ease,transform .1s ease;
}
#screen-calendar .cal-month-event:hover{box-shadow:0 1px 3px rgba(60,64,67,.25);filter:brightness(1.04)}
#screen-calendar .cal-month-event:active{transform:scale(.98)}
#screen-calendar .cal-month-event .me-dot{width:8px;height:8px;border-radius:50%;background:var(--event-color,#1a73e8);flex-shrink:0}
#screen-calendar .cal-month-event .me-time{color:var(--gc-muted);font-weight:600;font-size:10.5px;flex-shrink:0}
#screen-calendar .cal-month-event.done{opacity:.5}
#screen-calendar .cal-month-event.done .me-t{text-decoration:line-through}

/* ═══ 5) SIDE PANEL (Google "My calendars" feel) ═══ */
#screen-calendar .cal-panel{border-radius:16px}
#screen-calendar .cal-filter{border-radius:999px;font-size:13px;padding:8px 14px}
#screen-calendar .cal-filter .cal-dot{width:12px;height:12px;border-radius:3px}
#screen-calendar .cal-resource-subject-row{border-radius:12px;padding:8px 10px}
#screen-calendar .cal-resource-branch{border-radius:10px}
#screen-calendar .cal-resource-lecture{border-radius:8px;cursor:grab;transition:box-shadow .15s ease,transform .12s ease}
#screen-calendar .cal-resource-lecture:hover{box-shadow:0 1px 4px rgba(60,64,67,.18);transform:translateX(2px)}
html[dir="rtl"] #screen-calendar .cal-resource-lecture:hover{transform:translateX(-2px)}
#screen-calendar .cal-resource-lecture:active{cursor:grabbing}
/* mini calendar dots + polish */
#screen-calendar .cal-mini-grid button{position:relative;border-radius:50%;transition:background .15s ease}
#screen-calendar .cal-mini-grid button:hover{background:color-mix(in srgb,var(--gc-muted) 12%,transparent)}
#screen-calendar .cal-mini-grid button.is-today{border-color:var(--gc-blue);color:var(--gc-blue);font-weight:700}
#screen-calendar .cal-mini-grid button.is-selected{background:var(--gc-blue);color:#fff;font-weight:600}
html[data-theme="dark"] #screen-calendar .cal-mini-grid button.is-selected{color:#202124}
#screen-calendar .cal-mini-grid button.has-events::after{content:'';position:absolute;bottom:1px;inset-inline-start:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gc-blue)}

/* ═══ 6) RIGHT PANEL / agenda / year polish ═══ */
#screen-calendar .cal-upcoming-item{border-radius:12px;transition:background .15s ease,box-shadow .15s ease,border-color .15s ease}
#screen-calendar .cal-upcoming-item:hover{border-color:color-mix(in srgb,var(--gc-blue) 40%,transparent);box-shadow:0 1px 4px rgba(60,64,67,.12)}
#screen-calendar .cal-stat-value{font-family:Google Sans,system-ui,sans-serif;font-weight:500}
#screen-calendar .cal-progress i{transition:width .6s cubic-bezier(.2,.7,.3,1)}

/* ═══ 7) ANIMATIONS ═══ */
@keyframes gcIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes gcPop{0%{opacity:0;transform:scale(.94) translateY(6px)}100%{opacity:1;transform:none}}
.gc-anim{animation:gcIn .28s cubic-bezier(.2,.7,.3,1) both}
#screen-calendar .cal-week.gc-anim{z-index:5}

/* ═══ 8) EVENT QUICK-VIEW POPOVER (Google style) ═══ */
.gc-pop{
  position:fixed;z-index:6000;width:340px;max-width:calc(100vw - 24px);
  background:var(--cal-surface,#fff);color:var(--gc-ink);
  border:1px solid color-mix(in srgb,var(--gc-muted) 18%,transparent);
  border-radius:12px;box-shadow:0 8px 24px rgba(60,64,67,.25),0 2px 6px rgba(60,64,67,.15);
  padding:16px;animation:gcPop .18s cubic-bezier(.2,.7,.3,1) both;
  font-family:Google Sans,system-ui,sans-serif;
}
.gc-pop[hidden]{display:none}
.gc-pop-arrow{position:absolute;width:14px;height:14px;background:inherit;border:inherit;
  transform:rotate(45deg);top:-8px;border-right:0;border-bottom:0;border-radius:2px}
.gc-pop.gc-below .gc-pop-arrow{top:auto;bottom:-8px;border:0;border-right:1px solid color-mix(in srgb,var(--gc-muted) 18%,transparent);border-bottom:1px solid color-mix(in srgb,var(--gc-muted) 18%,transparent)}
.gc-pop-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.gc-pop-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.gc-pop-subject{font-size:12px;font-weight:700}
.gc-pop-branch{font-size:11px;color:var(--gc-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-pop-title{font-size:17px;font-weight:600;line-height:1.35;margin-bottom:6px;overflow-wrap:anywhere}
.gc-pop.done .gc-pop-title{text-decoration:line-through;color:var(--gc-muted)}
.gc-pop-time{font-size:13px;color:var(--gc-ink);display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:500}
.gc-pop-time .gc-ic{color:var(--gc-muted);font-size:14px}
.gc-pop-rows{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.gc-pop-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gc-muted)}
.gc-pop-row .gc-ic{width:16px;text-align:center;flex-shrink:0}
.gc-pop-row.gc-note{color:var(--gc-ink);background:color-mix(in srgb,var(--gc-muted) 7%,transparent);border-radius:8px;padding:8px 10px;line-height:1.5}
.gc-pop-actions{display:flex;align-items:center;gap:6px;border-top:1px solid color-mix(in srgb,var(--gc-muted) 14%,transparent);padding-top:10px}
.gc-pop-actions button{
  border:0;background:transparent;color:var(--gc-blue);font-weight:600;font-size:13px;
  padding:8px 12px;border-radius:8px;cursor:pointer;transition:background .15s ease;
}
.gc-pop-actions button:hover{background:color-mix(in srgb,var(--gc-blue) 9%,transparent)}
.gc-pop-actions button.gc-danger{margin-inline-start:auto;color:var(--gc-red)}
.gc-pop-actions button.gc-danger:hover{background:color-mix(in srgb,var(--gc-red) 9%,transparent)}

@media(max-width:820px){
  #screen-calendar .cal-title{font-size:17px}
  #screen-calendar .cal-search{width:110px}
  .gc-pop{width:calc(100vw - 20px)}
}
</style>

<script id="gc-pro-interactions">
(function(){
'use strict';
var scr=document.getElementById('screen-calendar'); if(!scr) return;
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function isoOf(d){return (window.calISO?calISO(d):new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))}
function viewKey(){var v=(typeof calView!=='undefined')?calView:'week';return v+'|'+(typeof calCurrent!=='undefined'?isoOf(calCurrent):'')}

/* ───────── wrap calRender ───────── */
var baseRender=window.calRender, lastKey='', savedScroll=0, firstBoot=true;
window.calRender=function(){ baseRender.apply(this,arguments); requestAnimationFrame(afterRender); };

function afterRender(){
  try{
    closePop();
    styleWeekends();
    decorateTimeEvents();
    decorateMonthEvents();
    injectNowLine();
    miniDots();
    animateIn();
    attachScrollMemory();
    bindEventClicks();
  }catch(e){console.warn('gc-pro',e)}
}

/* ───────── 1) weekend dimming ───────── */
function styleWeekends(){
  var cols=$$('#cal-board .cal-day-col[data-cal-date]');
  $$('#cal-board .cal-day-head').forEach(function(h,i){
    var dstr=cols[i]&&cols[i].dataset.calDate; if(!dstr)return;
    var day=new Date(dstr+'T00:00:00').getDay();
    if(day===0||day===6){h.classList.add('gc-wknd');cols[i].classList.add('gc-wknd');}
  });
  $$('#cal-board .cal-month-cell').forEach(function(c){
    var m=(c.getAttribute('ondblclick')||'').match(/\d{4}-\d{2}-\d{2}/);
    if(m){var day=new Date(m[0]+'T00:00:00').getDay(); if(day===0||day===6)c.classList.add('gc-wknd');}
  });
}

/* ───────── 2) rebuild week-event chips (Google look) ───────── */
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML}
function decorateTimeEvents(){
  $$('#cal-board .cal-event[data-cal-event]').forEach(function(ev,i){
    var id; try{id=decodeURIComponent(ev.dataset.calEvent)}catch(e){return}
    var p=id.split('|'); if(!window.calFind)return;
    var f=calFind(p[0],p[1]); if(!f)return;
    var s=f.task.schedule||{};
    var t = s.allday ? 'All day'
          : (window.calFmtTime&&s.start ? calFmtTime(s.start)+(s.end?' – '+calFmtTime(s.end):'') : (s.start||''));
    ev.innerHTML='<span class="gc-ev-time">'+esc(t)+'</span><span class="gc-ev-title">'+esc(f.task.text)+'</span><span class="cal-resize-grip" aria-hidden="true"></span>';
    ev.title=esc(f.task.text)+' · '+esc(t);
    ev.style.animationDelay=Math.min(i*22,260)+'ms';
  });
}

/* ───────── 3) month chips: dot + time ───────── */
function decorateMonthEvents(){
  $$('#cal-board .cal-month-event').forEach(function(b){
    if(b.querySelector('.me-dot'))return;
    var m=(b.getAttribute('onclick')||'').match(/calEditTask\('([^']+)'\)/); if(!m)return;
    var id; try{id=decodeURIComponent(m[1])}catch(e){return}
    var p=id.split('|'); if(!window.calFind)return;
    var f=calFind(p[0],p[1]); if(!f)return;
    var s=f.task.schedule||{};
    var c=''; try{c=calColor(f.goal.linkedTag||f.goal.title||'')}catch(e){}
    var time=(window.calFmtTime&&s.start&&!s.allday)?'<span class="me-time">'+esc(s.start)+'</span>':'';
    var txt=b.textContent;
    b.innerHTML='<span class="me-dot" style="--event-color:'+esc(c)+';background:'+esc(c)+'"></span>'+time+'<span class="me-t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(txt)+'</span>';
    if(f.task.done)b.classList.add('done');
  });
}

/* ───────── 4) NOW line ───────── */
function injectNowLine(){
  $$('.gc-now').forEach(function(n){n.remove()});
  var grid=$('#cal-board .cal-days-grid'); if(!grid)return;
  var today=isoOf(new Date());
  var col=grid.querySelector('.cal-day-col[data-cal-date="'+today+'"]'); if(!col)return;
  var now=new Date(), mins=now.getHours()*60+now.getMinutes();
  var line=document.createElement('div'); line.className='gc-now';
  line.style.top=(mins*56/60)+'px';
  col.appendChild(line);
}
setInterval(function(){ if(scr.classList.contains('active-view')) injectNowLine(); },20000);

/* ───────── 5) mini-calendar event dots ───────── */
function miniDots(){
  var byDate={};
  try{(window.calFilteredTasks?calFilteredTasks():[]).forEach(function(x){(byDate[x.date]=byDate[x.date]||[]).push(x)})}catch(e){}
  $$('#cal-mini .cal-mini-grid button').forEach(function(b){
    var m=(b.getAttribute('onclick')||'').match(/\d{4}-\d{2}-\d{2}/);
    if(m&&byDate[m[0]])b.classList.add('has-events');
  });
}

/* ───────── 6) entrance animations ───────── */
function animateIn(){
  ['.cal-week','.cal-grid-wrap','.cal-month-wrap','.cal-agenda-list','.cal-year-grid'].forEach(function(sel){
    var el=$(sel); if(el){el.classList.remove('gc-anim');void el.offsetWidth;el.classList.add('gc-anim');}
  });
  $$('#cal-board .cal-event').forEach(function(ev){ev.classList.add('gc-anim')});
}

/* ───────── 7) scroll memory + auto scroll to 7:00 ───────── */
function attachScrollMemory(){
  var wrap=$('#cal-board .cal-grid-wrap'); if(!wrap)return;
  wrap.addEventListener('scroll',function(){savedScroll=wrap.scrollTop});
  var k=viewKey();
  if(k!==lastKey||firstBoot){
    wrap.scrollTop=Math.max(0,7*56-80); lastKey=k; firstBoot=false;
  } else wrap.scrollTop=savedScroll;
  savedScroll=wrap.scrollTop;
}

/* ───────── 8) EVENT CLICK → Google quick-view popover ───────── */
function bindEventClicks(){
  $$('#cal-board .cal-event[data-cal-event], #cal-board .cal-month-event').forEach(function(el){
    var raw=el.dataset.calEvent;
    if(!raw){var m=(el.getAttribute('onclick')||'').match(/calEditTask\('([^']+)'\)/); if(m)raw=m[1];}
    if(!raw)return;
    var id; try{id=decodeURIComponent(raw)}catch(e){return}
    el.onclick=null;
    el.addEventListener('click',function(e){
      e.preventDefault(); e.stopPropagation();
      openPop(id,el);
    });
  });
}

/* popover */
var pop=null;
function buildPop(){
  if(pop)return pop;
  pop=document.createElement('div'); pop.className='gc-pop'; pop.hidden=true; pop.id='gc-pop';
  pop.innerHTML='<div class="gc-pop-arrow"></div>'
    +'<div class="gc-pop-head"><span class="gc-pop-dot"></span><span class="gc-pop-subject"></span><span class="gc-pop-branch"></span></div>'
    +'<div class="gc-pop-title"></div>'
    +'<div class="gc-pop-time"><span class="gc-ic">🕒</span><span class="gc-pop-when"></span></div>'
    +'<div class="gc-pop-rows"></div>'
    +'<div class="gc-pop-actions">'
    +'<button data-a="done"></button>'
    +'<button data-a="edit">✎ Edit</button>'
    +'<button data-a="unsched" class="gc-danger">🗑 Unschedule</button>'
    +'</div>';
  document.body.appendChild(pop);
  pop.addEventListener('pointerdown',function(e){e.stopPropagation()});
  pop.addEventListener('click',function(e){
    var a=e.target.closest('[data-a]'); if(!a)return;
    var st=pop._state; if(!st)return;
    if(a.dataset.a==='edit'){closePop();window.calEditTask&&calEditTask(encodeURIComponent(st.gid+'|'+st.tid));}
    if(a.dataset.a==='unsched'){
      if(!confirm('Remove this lecture from the calendar? (The lecture itself stays in INDEX)'))return;
      delete st.f.task.schedule;
      window.dbSet&&dbSet('goals',goalsArray);
      window.renderGoalsScreen&&renderGoalsScreen(); window.refreshTimerSidebar&&refreshTimerSidebar();
      closePop(); window.calRender();
      window.showToast&&showToast('Task unscheduled','','success');
    }
    if(a.dataset.a==='done'){
      st.f.task.done=!st.f.task.done;
      window.dbSet&&dbSet('goals',goalsArray);
      window.renderGoalsScreen&&renderGoalsScreen(); window.refreshTimerSidebar&&refreshTimerSidebar();
      closePop(); window.calRender();
      window.showToast&&showToast(st.f.task.done?'Marked as done':'Marked as pending','','success');
    }
  });
  return pop;
}
var REPEAT={daily:'Daily',weekdays:'Every weekday',weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly'};
var REMIND={0:'At start',5:'5 min before',10:'10 min before',30:'30 min before',60:'1 hour before'};
function openPop(id,anchor){
  if(!window.calFind)return;
  var p=id.split('|'); var f=calFind(p[0],p[1]); if(!f)return;
  var pop=buildPop(), s=f.task.schedule||{};
  var subject=f.goal.linkedTag||'General';
  var color=''; try{color=calColor(subject)}catch(e){}
  pop._state={gid:p[0],tid:p[1],f:f};
  pop.querySelector('.gc-pop-dot').style.background=color;
  pop.querySelector('.gc-pop-subject').textContent=subject;
  pop.querySelector('.gc-pop-branch').textContent=f.goal.title||'';
  pop.querySelector('.gc-pop-title').textContent=f.task.text||'';
  var when;
  if(s.allday){when=s.date+' · All day'}
  else{
    var dur='';
    if(s.start&&s.end&&window.calMinutes){var d=calMinutes(s.end)-calMinutes(s.start); if(d>0)dur=' · '+Math.floor(d/60)+'h'+(d%60?' '+d%60+'m':'')}
    when=(s.date||'')+' · '+((window.calFmtTime&&s.start)?calFmtTime(s.start):s.start||'')+(s.end?' – '+((window.calFmtTime)?calFmtTime(s.end):s.end):'')+dur;
  }
  pop.querySelector('.gc-pop-when').textContent=when;
  var rows=[];
  if(s.location)rows.push('<div class="gc-pop-row"><span class="gc-ic">📍</span>'+esc(s.location)+'</div>');
  if(s.repeat&&s.repeat!=='none')rows.push('<div class="gc-pop-row"><span class="gc-ic">🔁</span>'+(REPEAT[s.repeat]||s.repeat)+(s.repeatUntil?' · until '+esc(s.repeatUntil):'')+'</div>');
  if(s.reminder&&s.reminder!=='none')rows.push('<div class="gc-pop-row"><span class="gc-ic">🔔</span>'+(REMIND[s.reminder]||(s.reminder+' min before'))+'</div>');
  if(s.priority&&s.priority!=='Normal')rows.push('<div class="gc-pop-row"><span class="gc-ic">⚑</span>'+esc(s.priority)+' priority</div>');
  if(f.task.studyCount)rows.push('<div class="gc-pop-row"><span class="gc-ic">📖</span>Studied '+f.task.studyCount+'×</div>');
  if(s.notes)rows.push('<div class="gc-pop-row gc-note">'+esc(s.notes)+'</div>');
  pop.querySelector('.gc-pop-rows').innerHTML=rows.join('');
  pop.querySelector('[data-a="done"]').textContent=f.task.done?'↩ Undo done':'✓ Mark done';
  pop.classList.toggle('done',!!f.task.done);

  pop.hidden=false;
  var r=anchor.getBoundingClientRect(), W=340, H=pop.offsetHeight;
  var left=r.left+r.width/2-W/2, top=r.bottom+12;
  var below=false;
  if(top+H>window.innerHeight-10){top=r.top-H-12;below=true}
  left=Math.max(10,Math.min(left,window.innerWidth-W-10));
  if(top<10)top=10;
  pop.classList.toggle('gc-below',below);
  var arrow=pop.querySelector('.gc-pop-arrow');
  arrow.style.left=Math.max(16,Math.min(r.left+r.width/2-left-7,W-30))+'px';
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function closePop(){var p=$('#gc-pop'); if(p)p.hidden=true}
document.addEventListener('pointerdown',function(e){ if(pop&&!pop.hidden&&!e.target.closest('.gc-pop'))closePop() },true);
document.addEventListener('keydown',function(e){ if(e.key==='Escape')closePop() });
document.addEventListener('scroll',function(e){ if(e.target&&e.target.closest&&e.target.closest('#cal-board'))closePop() },true);

/* rail drag highlight */
document.addEventListener('dragstart',function(e){
  if(e.target&&e.target.closest&&e.target.closest('.cal-resource-lecture,.cal-resource-branch'))scr.classList.add('gc-droppable');
});
document.addEventListener('dragend',function(){scr.classList.remove('gc-droppable')});

/* keyboard shortcuts (calendar active, not typing) */
document.addEventListener('keydown',function(e){
  if(!scr.classList.contains('active-view'))return;
  var t=document.activeElement&&document.activeElement.tagName;
  if(['INPUT','TEXTAREA','SELECT'].includes(t))return;
  var k=e.key.toLowerCase();
  if(k==='t'&&window.calGoToday){calGoToday()}
  else{var map={d:'day',w:'week',m:'month',a:'agenda',y:'year',g:'workweek'}; if(map[k]&&window.calSetView)calSetView(map[k])}
});
})();
</script>
